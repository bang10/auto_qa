[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v -s --html=reports/report.html --self-contained-html
markers =
    mobile_only: 모바일 웹 환경(--platform=mobile)에서만 실행되는 반응형 UI 전용 테스트
    critical_login: 실패 시 후속 테스트를 모두 중단하고 세션을 즉시 종료하는 필수 관문 테스트

# 로그 출력 포맷 및 레벨 설정
log_cli = true
log_cli_level = INFO
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] (%(filename)s:%(lineno)s) - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
